name: "Khanh Rocket Lab - YouTube API Observer"
description: "Read-only metadata counting, no protobuf parsing or video rewrite."
author: "Vcab3011"
homepage: "https://github.com/Vcab3011/Khanh-Rocket"
scriptings:
  - http_response:
      name: "Khanh YouTube Endpoint Probe"
      match: '^https://youtubei\.googleapis\.com/youtubei/v1/(player|browse|next|search|get_watch|reel/reel_watch_sequence)([?#]|$)'
      script_url: "https://raw.githubusercontent.com/Vcab3011/Khanh-Rocket/f9c72dff2a4f92e7c93a9c1a44777e286f0a5ea3/lab/build/egern-observer.js"
      body_required: false
      timeout: 10
      update_interval: 86400
mitm:
  enabled: true
  hostnames:
    - "youtubei.googleapis.com"
