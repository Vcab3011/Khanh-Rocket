name: "Khanh Rocket Lab - Locket Observer"
description: "Read-only CustomerInfo observation. Does not modify subscriptions."
author: "Vcab3011"
homepage: "https://github.com/Vcab3011/Khanh-Rocket"
scriptings:
  - http_response:
      name: "Khanh Locket CustomerInfo Probe"
      match: '^https://api\.revenuecat\.com/v1/(subscribers/[^/?#]+|receipts)([?#]|$)'
      script_url: "https://raw.githubusercontent.com/Vcab3011/Khanh-Rocket/f9c72dff2a4f92e7c93a9c1a44777e286f0a5ea3/lab/build/egern-observer.js"
      body_required: true
      binary_body: true
      max_size: 262144
      timeout: 10
      update_interval: 86400
# Egern must use the user's own locally generated HTTPS CA.
mitm:
  enabled: true
  hostnames:
    - "api.revenuecat.com"
