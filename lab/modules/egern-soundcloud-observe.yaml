name: "Khanh Rocket Lab - SoundCloud Observer"
description: "Read-only SoundCloud iOS feature configuration analyzer; no plan modification."
author: "Vcab3011"
homepage: "https://github.com/Vcab3011/Khanh-Rocket"
scriptings:
  - http_response:
      name: "Khanh SoundCloud Feature Probe"
      match: '^https://api-mobile\.soundcloud\.com/configuration/ios([?#]|$)'
      script_url: "https://raw.githubusercontent.com/Vcab3011/Khanh-Rocket/08492da2a230293140e4e5ff3da11bd87ac5af29/lab/build/egern-observer.js"
      body_required: true
      max_size: 262144
      timeout: 10
      update_interval: 86400
mitm:
  enabled: true
  hostnames:
    - "api-mobile.soundcloud.com"
