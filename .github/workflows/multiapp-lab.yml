name: Multi-App Lab Read-only Validation
on:
  push:
    branches: ["feature/multiapp-observability-v1"]
  pull_request:
    paths:
      - "lab/**"
      - ".github/workflows/multiapp-lab.yml"
permissions:
  contents: read
jobs:
  lab-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install YAML parser for module schema validation
        run: python -m pip install PyYAML==6.0.2
      - name: Verify offline Egern build is deterministic
        run: python lab/tools/build_runtime.py --check
      - name: Test app classification, privacy and runtime adapters
        run: node --test lab/tests/*.test.cjs
      - name: Validate independently installable Egern modules
        run: python -m unittest discover -s lab/tests -p "test_*.py" -v
      - name: Recheck immutable baseline and V3 supply chain
        run: |
          python tools/validate_legacy.py
          python native/v3/audit_supply_chain.py
