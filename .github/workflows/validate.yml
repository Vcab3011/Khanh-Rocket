name: Validate Shadowrocket config
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test Khanh Native audit and baseline lock
        run: |
          python -m unittest discover -s native/tests -p 'test_*.py' -v
          python native/tools/audit_pipeline.py > /tmp/khanh-native-audit.json
      - name: Test Khanh Native policy modules (offline)
        run: node --test native/tests/*.test.cjs
      - name: Validate generated profiles
        run: |
          python tools/build.py --profile canada-direct
          python tools/build.py --profile vn-split
          python tools/build.py --profile vn-full
          python tools/build.py --profile apps-privacy
          for f in build/apps-privacy.conf build/canada-direct.conf build/vn-split.conf build/vn-full.conf; do python tools/validate.py "$f"; done
          python tools/validate_legacy.py
