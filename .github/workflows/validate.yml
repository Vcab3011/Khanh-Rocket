name: Validate Shadowrocket config
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate generated profiles
        run: |
          python tools/build.py --profile canada-direct
          python tools/build.py --profile vn-split
          python tools/build.py --profile vn-full
          python tools/build.py --profile apps-privacy
          python tools/build.py --profile apps-privacy --output build/khanh-rocket.conf
          git diff --exit-code -- build/khanh-rocket.conf
          for f in build/*.conf; do python tools/validate.py "$f"; done
