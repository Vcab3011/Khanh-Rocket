spotify-proto = type=http-response,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$,requires-body=1,binary-body-mode=1,max-size=5242880,script-path=https://raw.githubusercontent.com/Vcab3011/Khanh-Rocket/d7d43523dd973c0184a70a3398935c15eef96648/native/v2/scripts/spotify-protobuf.js,script-update-interval=0
