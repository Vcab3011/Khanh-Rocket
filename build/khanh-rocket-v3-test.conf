hostname = *.googlevideo.com, youtubei.googleapis.com, www.youtube.com, s.youtube.com, spclient.wg.spotify.com, *spclient.spotify.com, api-mobile.soundcloud.com, us-central1-alight-creative.cloudfunctions.net, api.picsart.com, api-sub.meitu.com, premium*.truecaller.com, api-account.kinemasters.com, ap*.intsig.net, api.mr.pixocial.com, newbeee-api.beautyplus.com, api.revenuecat.com, khanh.invalid
