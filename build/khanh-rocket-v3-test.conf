Native Offline Subscriptions = type=http-request,pattern=^https:\/\/khanh\.invalid\/v1\/(health|normalize)$,requires-body=true,max-size=131072,timeout=10,script-path=https://raw.githubusercontent.com/Vcab3011/Khanh-Rocket/05f8ae6a3b96eae528b0c786d3de8ccbd0a978b0/native/v3/scripts/offline-subscriptions.js

[Map Local]
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad data-type=text data="" status-code=200

