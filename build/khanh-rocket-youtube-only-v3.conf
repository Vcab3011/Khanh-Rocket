#!name = Khanh Rocket YouTube Only V3
#!desc = YouTube-only canary: preserved player plus revised feed filter. Device validation required.
#!author = Vcab3011
# Separate Shadowrocket profile; never import this .conf into Egern.
# Working V3 Test and production URLs remain unchanged.
# Instructions: docs/YOUTUBE_V3_CANARY.md
# Feed source: ca7a2ede3f059fb66cbfd7b542938389e5096d35

[Rule]
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

[Url Rewrite]
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ reject-200
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302

[Script]
youtube.native.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(player|get_watch|reel\/reel_watch_sequence)(?:\?|$),requires-body=true,max-size=5242880,binary-body-mode=1,timeout=10,script-path=https://raw.githubusercontent.com/Vcab3011/Khanh-Rocket/d7d43523dd973c0184a70a3398935c15eef96648/native/v2/scripts/youtube-player-protobuf.js
youtube.native.browse = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|search)(?:\?|$),requires-body=true,max-size=5242880,binary-body-mode=1,timeout=10,script-path=https://raw.githubusercontent.com/Vcab3011/Khanh-Rocket/ca7a2ede3f059fb66cbfd7b542938389e5096d35/native/v3/scripts/youtube-feed-filter.js

[Map Local]
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad data-type=text data="" status-code=200

[MITM]
hostname = *.googlevideo.com, youtubei.googleapis.com, www.youtube.com, s.youtube.com
